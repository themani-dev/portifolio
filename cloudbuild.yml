  steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'portifolio', './frontend/main/']
  # Tag the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'portifolio', 'us-central1-docker.pkg.dev/hakoona-matata-298704/portifolio/portifolio:latest']
  # Tag the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/hakoona-matata-298704/portifolio/portifolio:latest']
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'portifolio'
    - '--image'
    - 'us-central1-docker.pkg.dev/hakoona-matata-298704/portifolio/portifolio:latest'
    - '--region'
    - 'us-central1'
    - '--service-account'
    - 'admin-service-account@hakoona-matata-298704.iam.gserviceaccount.com'
  images:
  - 'us-central1-docker.pkg.dev/hakoona-matata-298704/portifolio/portifolio:latest'
  options:
    logging: CLOUD_LOGGING_ONLY
  steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'portifolio', '.']
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'portifolio', 'us-docker.pkg.dev/hakoona-matata-298704/portifolio/portifolio:latest']
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'portifolio'
    - '--image'
    - 'gcr.io/hakoona-matata-298704/SERVICE-NAME:latest'
    - 'us-docker.pkg.dev/hakoona-matata-298704/portifolio/portifolio:latest'
    - '--region'
    - 'us-central1'
  images:
  - 'us-docker.pkg.dev/hakoona-matata-298704/portifolio/portifolio:latest'